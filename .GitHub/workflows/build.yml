name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y openjdk-17-jdk zip unzip autoconf automake libtool libffi-dev libssl-dev pkg-config cmake libltdl-dev -qq
          pip install -q buildozer Cython==0.29.36

      - name: Extract your zip
        run: |
          ls -la
          rm -rf app_src
          mkdir app_src
          unzip -o dongmurih-1.zip -d app_src
          echo "=== Inside app_src ==="
          ls -la app_src/
          ls -la app_src/*/ 2>/dev/null || true
          # Find where buildozer.spec is and move ALL files to root
          find app_src -type f -name "buildozer.spec"
          SPEC_DIR=$(find app_src -name "buildozer.spec" -exec dirname {} \; | head -1)
          echo "Spec is in: $SPEC_DIR"
          cp -r $SPEC_DIR/*.
          cp -r $SPEC_DIR/.buildozer. 2>/dev/null || true
          ls -la
          cat buildozer.spec | head -30

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopmanager-apk
          path: bin/*.apk
