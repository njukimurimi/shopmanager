name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update -qq
          sudo apt install -y openjdk-17-jdk zip unzip autoconf automake libtool libffi-dev libssl-dev pkg-config cmake -qq
          pip install -q buildozer Cython==0.29.36
      - name: Unzip and prepare
        run: |
          ls -la
          unzip -o dongmurih-1.zip
          ls -la
          # Your zip has a folder inside, move out
          if [ -d "dongmurih-1" ]; then cp -rf dongmurih-1/*.; fi
          if [ -d "dongmurih" ]; then cp -rf dongmurih/*.; fi
          ls -la
          echo "---SPEC---"
          cat buildozer.spec
          echo "---FILES---"
          ls
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopmanager-apk
          path: bin/*.apk
