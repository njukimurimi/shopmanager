
name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip autoconf automake libtool libffi-dev libssl-dev pkg-config cmake
          pip install --upgrade pip
          pip install buildozer Cython==0.29.36
      - name: Unzip project
        run: |
          unzip -o dongmurih-1.zip
          ls -la
          # if your files are inside a folder, move them out
          mv dongmurih-1/*. || mv dongmurih/*. || true
          ls -la
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopmanager-apk
          path: bin/*.apk
