name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          sudo apt update -qq
          sudo apt install -y openjdk-17-jdk zip unzip
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install buildozer Cython==0.29.33

      - name: Extract
        run: |
          rm -rf app
          unzip -o dongmurih-1.zip -d app
          DIR=$(find app -name "main.py" | head -1 | xargs dirname)
          echo "DIR is $DIR"
          cp -a $DIR/..
          ls -la

      - name: Create clean spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Shop Manager
          package.name = shopmanager
          package.domain = com.njukimurimi.shopmanager
          source.dir =.
          source.include_exts = py,png,jpg,kv,atlas,json,ttf,db
          version = 1.0
          requirements = python3,kivy==2.3.0,kivymd==1.1.1,pillow
          orientation = portrait
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.archs = arm64-v8a
          android.accept_sdk_license_agreement = True
          p4a.branch = master
          [buildozer]
          log_level = 1
          EOF

      - name: Build
        run: |
          python3.10 -m buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopmanager-apk
          path: bin/*.apk
