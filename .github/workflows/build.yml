name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip libffi-dev libssl-dev libjpeg8-dev
          pip install buildozer Cython==0.29.36

      - name: Accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "platforms;android-33" || true

      - name: Extract
        run: |
          rm -rf app
          unzip -o dongmurih-1.zip -d app
          DIR=$(find app -name "main.py" | head -1 | xargs dirname)
          cp -a "$DIR"/. .
          ls *.py

      - name: Create spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Shop Manager
          package.name = shopmanager
          package.domain = com.njukimurimi.shopmanager
          source.dir =.
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          requirements = python3,kivy==2.2.0
          orientation = portrait
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.build_tools_version = 33.0.2
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 2
          EOF

      - name: Build
        run: |
          set -o pipefail
          export PATH=$JAVA_HOME/bin:$PATH
          buildozer android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
