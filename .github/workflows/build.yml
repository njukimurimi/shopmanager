name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update -qq
          sudo apt install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config cmake libffi-dev libssl-dev -qq
          pip install -q buildozer Cython==0.29.36
      - name: Extract
        run: |
          unzip -o dongmurih-1.zip -d app
          SPEC=$(find app -name buildozer.spec | head -1)
          echo "Found: $SPEC"
          DIR=$(dirname "$SPEC")
          echo "Copying from $DIR"
          cp -r $DIR/. .
          ls -la
          cat buildozer.spec | head -20
 
      - name: Build
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopmanager-apk
          path: bin/*.apk
