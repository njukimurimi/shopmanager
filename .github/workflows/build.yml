name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update -qq
          sudo apt install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config cmake libffi-dev libssl-dev libltdl-dev -qq
          pip install -q buildozer Cython==0.29.36
      - name: Extract
        run: |
          unzip -o dongmurih-1.zip -d app
          SPEC=$(find app -name buildozer.spec | head -1)
          DIR=$(dirname "$SPEC")
          cp -r $DIR/..
          ls -la
      - name: Fix spec duplicates
        run: |
          echo "Fixing duplicate android.archs"
          # Remove duplicate lines keeping last one
          python3 << 'PY'
          seen={}
          lines=open('buildozer.spec').read().splitlines()
          out=[]
          # simple fix: remove second occurrence of android.archs
          count=0
          for line in lines:
              if 'android.archs' in line and '=' in line:
                  count+=1
                  if count==2:
                      continue # skip second duplicate
              out.append(line)
          open('buildozer.spec','w').write('\n'.join(out))
          print("Fixed!")
          PY
          grep -n "android.archs" buildozer.spec
      - name: Build
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopmanager-apk
          path: bin/*.apk
